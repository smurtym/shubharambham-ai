<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shubharambham</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Shubharambham</h1>
  <p>Work in Progress</p>

  <form id="horoscope-form">
    <label for="city-id">City ID:</label>
    <input type="number" id="city-id" value="11705" min="0">

    <label for="local-time">Local Date &amp; Time:</label>
    <input type="datetime-local" id="local-time" value="1961-10-28T07:30">

    <label for="lang">Language:</label>
    <select id="lang">
      <option value="en">English</option>
      <option value="te">తెలుగు</option>
    </select>

    <button type="submit" id="submit">Calculate</button>
  </form>

  <pre id="horoscope-result"></pre>

  <script>
    document.getElementById('horoscope-form').addEventListener('submit', function (e) {
      e.preventDefault();

      var cityId    = parseInt(document.getElementById('city-id').value, 10);
      var localTime = document.getElementById('local-time').value + ':00';
      var lang      = document.getElementById('lang').value;
      var submitBtn = document.getElementById('submit');
      var resultEl  = document.getElementById('horoscope-result');

      submitBtn.disabled = true;
      resultEl.textContent = '';

      try {
        var result = getHoroscopePositions(cityId, localTime, lang);
        resultEl.textContent = JSON.stringify(result, null, 2);
      } catch (err) {
        resultEl.textContent = 'Error: ' + err.message;
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>

  <script src="astro-glue.js"></script>
  <script src="data.js"></script>
  <script src="components.js"></script>
  <script src="astro.js"></script>
</body>
</html>
