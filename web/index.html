<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shubharambham</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Shubharambham</h1>
  <p>Work in Progress</p>

  <form id="sun-form">
    <label for="datetime">Date &amp; Time (UTC):</label>
    <input type="datetime-local" id="datetime" value="2000-01-01T12:00">

    <label for="lang">Language:</label>
    <select id="lang">
      <option value="en">English</option>
      <option value="te">తెలుగు</option>
    </select>

    <button type="submit" id="submit">Calculate</button>
  </form>

  <div id="result"></div>

  <script>
    document.getElementById('sun-form').addEventListener('submit', function (e) {
      e.preventDefault();

      var datetimeInput = document.getElementById('datetime').value;
      var lang          = document.getElementById('lang').value;
      var submitBtn     = document.getElementById('submit');
      var resultEl      = document.getElementById('result');

      // datetime-local yields YYYY-MM-DDTHH:MM — append :00Z for full UTC ISO 8601.
      var isoUtc = datetimeInput + ':00Z';

      submitBtn.disabled = true;
      resultEl.textContent = '';

      try {
        var result = getSunLongitude(isoUtc, lang);
        if (result.error) {
          resultEl.textContent = 'Error: ' + result.error;
        } else {
          resultEl.textContent = result.label + ' — ' + result.longitude.toFixed(2) + '°';
        }
      } catch (err) {
        resultEl.textContent = 'Error: ' + err.message;
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>

  <script src="astro-glue.js"></script>
  <script src="data.js"></script>
  <script src="components.js"></script>
  <script src="astro.js"></script>
</body>
</html>
